# ============================================================
# 每日信息因子快照（生产调度）
# 01:00 UTC = 北京 09:00 = 仰光 07:30 —— 快照在工作时间前生成
# 提交历史 = 审计留痕（谁=bot/何时=提交时间/证据=snapshots 内 evidence + audit/*.md）
# ============================================================
name: daily-info-snapshot

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch: {}   # 手动触发兜底（Actions 定时可能延迟几十分钟）

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 评分卡单元测试（不绿不发布）
        run: python -m unittest discover -s tests -v

      - name: 生成当日快照（ACLED 凭证来自 Secrets；Cloudflare 拦截/未配置时自动降级 GDELT）
        env:
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
        run: python pipeline/build_snapshot.py

      - name: 提交快照、状态页与审计（无变化则跳过提交）
        run: |
          git config user.name "seikcha-info-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots/ status/ audit/
          git diff --cached --quiet || git commit -m "snapshot: $(date -u +%F) 每日信息因子快照（含状态页数据）"
          git pull --rebase origin main   # 期间若有文档等人工提交，先变基再推（手动重跑同日文件会更新）
          git push
